name: Process Blockchain Data

on:
  push:
    branches: [ "main" ]
    paths:
      - 'italy_case/**'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl

    - name: Run the analysis script
      run: python italy_case/seperateGroups/compareGroups.py

    - name: Upload output files
      uses: actions/upload-artifact@v4
      with:
        name: blockchain-split-data
        path: |
          italy_case/seperateGroups/blockchain_users.xlsx
          italy_case/seperateGroups/blockchain_non_users.xlsx
