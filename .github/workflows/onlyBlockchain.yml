name: Filter Blockchain Without IoT

on:
  push:
    branches: [ "main" ]
    paths:
      - 'italy_case/**'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl

    - name: Run the analysis script
      working-directory: ./italy_case/separateGroups
      run: python onlyBlockchain_users.py

    - name: Upload output file
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: blockchain-no-iot-data
        path: italy_case/separateGroups/blockchain_no_iot.xlsx
