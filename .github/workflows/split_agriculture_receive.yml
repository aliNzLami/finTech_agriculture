name: Split Global Findex Data

on:
  push:
    branches: [ "main" ]
    paths:
      - 'findex/**'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl

    - name: Run the analysis script
      working-directory: ./findex
      run: python receive_agriculture.py

    - name: Upload output files
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: findex-split-data
        path: |
          findex/agriculture_into_account.xlsx
          findex/agriculture_in_cash.xlsx
